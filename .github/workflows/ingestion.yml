name: County data pipeline
on:
  workflow_dispatch:
    inputs:
      start_year:
        description: First historical year
        default: '2015'
        required: true
      end_year:
        description: Last historical year
        default: '2026'
        required: true
      smoke_only:
        description: Run only the common seven-day sample
        type: boolean
        default: true
      resolution:
        type: choice
        options: [event, 15min]
        default: event
permissions:
  contents: read
concurrency:
  group: county-data-pipeline
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      NWS_USER_AGENT: ${{ vars.NWS_USER_AGENT || '(WattsNextPipeline, data-team@example.com)' }}
      START_YEAR: ${{ inputs.start_year }}
      END_YEAR: ${{ inputs.end_year }}
      RESOLUTION: ${{ inputs.resolution }}
      SMOKE_ONLY: ${{ inputs.smoke_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: python -m pip install -r requirements.txt -r requirements-pipeline.txt
      - run: python -m unittest tests.test_ingestion_pipeline -v
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: county-archives-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: county-archives-v1-${{ runner.os }}-
      - name: Fetch and validate official data
        shell: bash
        run: |
          args=(--start-year "$START_YEAR" --end-year "$END_YEAR" --resolution "$RESOLUTION")
          if [ "$SMOKE_ONLY" = true ]; then args+=(--smoke-test); fi
          python run_all.py "${args[@]}"
      - name: Apply Neon schema and import validated CSVs
        if: ${{ success() }}
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          test -n "$DATABASE_URL_UNPOOLED"
          python scripts/migrate.py
          python scripts/import_pipeline_csvs.py --run-key "${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}"
