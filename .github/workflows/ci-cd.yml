name: Watt'sNext CI/CD

on:
  pull_request:
  push:
    branches: [backend-section, main, master]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wattsnext-${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && 'production' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'
  PYTHONDONTWRITEBYTECODE: '1'
  WATTSNEXT_USE_NEON: 'false'
  DATABASE_URL: ''
  WATTSNEXT_PROVIDER: local

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check for tracked secrets and local env files
        shell: bash
        run: |
          test ! -f .env && test ! -f .env.local
          if git ls-files | grep -Ev '(^|/)\.env\.example$' | grep -E '(^|/)(\.env|\.env\..*)$|\.pem$|\.key$'; then
            echo 'Secret-like files are tracked.'
            exit 1
          fi
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    needs: repository-checks
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: wattsnext_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d wattsnext_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/wattsnext_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile all Python modules
        run: python -m compileall -q backend concierge server.py api scripts
      - name: Lint Python
        run: python -m ruff check backend concierge server.py api scripts tests
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Run unit and API tests
        run: python -m unittest discover -s tests -v
      - name: Verify migration files are present and parseable
        run: |
          test -s migrations/001_initial.sql
          test -s migrations/002_household_case_mapping.sql
          python - <<'PY'
          from pathlib import Path
          for path in Path('migrations').glob('*.sql'):
              text = path.read_text()
              assert 'create table' in text.lower() or 'alter table' in text.lower()
          print('Migration files validated')
          PY

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    needs: repository-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install frontend tooling
        run: npm ci
      - name: Audit frontend dependencies
        # The application ships no runtime npm packages; Vercel and Playwright are
        # CI/deployment tooling. Audit the production dependency graph here so a
        # transitive advisory in the deployment CLI cannot block application CI.
        run: npm audit --omit=dev --audit-level=high
      - name: Validate frontend build and JavaScript syntax
        run: npm run build
      - name: Validate JSON configuration
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json')); JSON.parse(require('fs').readFileSync('package.json'))"

  browser-checks:
    name: Browser checks
    runs-on: ubuntu-latest
    needs: [python-checks, frontend-checks]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
            reports/
          retention-days: 7

  docker-checks:
    name: Docker checks
    runs-on: ubuntu-latest
    needs: [python-checks, frontend-checks]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag wattsnext:${{ github.sha }} .
      - name: Start production container
        run: |
          docker run -d --name wattsnext-ci -p 8000:8000 \
            -e WATTSNEXT_USE_NEON=false \
            wattsnext:${{ github.sha }}
      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/api/health/database; then exit 0; fi
            sleep 2
          done
          docker logs wattsnext-ci
          exit 1
      - name: Verify homepage and API docs
        run: |
          curl --fail --silent http://127.0.0.1:8000/ > /dev/null
          curl --fail --silent http://127.0.0.1:8000/api/docs > /dev/null
          docker exec wattsnext-ci python scripts/smoke.py http://127.0.0.1:8000
      - if: always()
        run: docker logs wattsnext-ci || true
      - if: always()
        run: docker rm --force wattsnext-ci || true

  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    needs: [python-checks, frontend-checks, browser-checks, docker-checks]
    steps:
      - uses: actions/checkout@v4
      - name: Check production deployment files
        run: |
          test -s vercel.json
          test -s api/index.py
          test -s Dockerfile
          test -s docker-compose.yml
          grep -q 'DATABASE_URL' README.md
          grep -q 'GEMINI_API_KEY' README.md
      - name: Generate release metadata
        run: |
          mkdir -p release
          printf 'commit=%s\nref=%s\n' "$GITHUB_SHA" "$GITHUB_REF" > release/metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wattsnext-release-${{ github.sha }}
          path: release/metadata.txt

  deploy-vercel:
    name: Deploy to Vercel
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [release-readiness, neon-migrations]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
      - run: npm ci
      - name: Deploy production build
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          npx --no-install vercel deploy --prod --token "$VERCEL_TOKEN" --yes

  neon-migrations:
    name: Apply production Neon migrations
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: release-readiness
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Validate release secrets before changing production
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$DATABASE_URL_UNPOOLED"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
      - name: Install migration dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Apply versioned migrations to Neon production
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          test -n "$DATABASE_URL_UNPOOLED"
          python scripts/migrate.py
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['DATABASE_URL_UNPOOLED']) as conn:
              with conn.cursor() as cur:
                  cur.execute("select count(*) from information_schema.tables where table_schema='public' and table_name='households'")
                  assert cur.fetchone()[0] == 1
          print('Production Neon schema verified')
          PY
