[project]
name = "wattsnext"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.3.6",
]

[tool.ruff]
target-version = "py313"
exclude = [".venv-ci", "node_modules", "aep-data"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
source = ["concierge", "backend", "server"]

[tool.coverage.report]
show_missing = true
fail_under = 65
